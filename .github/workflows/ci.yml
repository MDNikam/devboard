# Goal - i have to lint, build the code for Frontend and Backend and run the tests for both Frontend and Backend
#Push the image to dockerHUb

name: CI

on:
  push:
    branches: [master]

  workflow_dispatch:
  
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend
      
      - name: Docker setup
        uses: docker/setup-buildx-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker and Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/Dockerfile.multistage
          file: ./frontend/Dockerfile.multistage
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest



  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          go-version-file: go.mod
          cache: go
          cache-dependency-path: go.sum

      - name: Run go formatter
        run: go fmt ./...
        working-directory: backend

      - name: Run Go vet
        run: go vet ./...
        working-directory: backend

      - name: Run tests
        run: go test ./...
        working-directory: backend

      - name: Docker Login setup
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Build Docker and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/Dockerfile.multistage
          file: ./backend/Dockerfile.multistage
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest
      
      

      