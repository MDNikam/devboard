# Goal - i have to lint, build the code for Frontend and Backend and run the tests for both Frontend and Backend
#Push the image to dockerHUb

name: CI

on:
  push:
    branches: [advanced]
  
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend
      
      - name: Build
        run: npm run build
        working-directory: frontend


