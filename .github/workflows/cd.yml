
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [advanced]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Create environment file
      - name: Configure environment
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        run: |
          set -e

          test -n "$POSTGRES_USER" || exit 1
          test -n "$POSTGRES_PASSWORD" || exit 1
          test -n "$POSTGRES_DB" || (echo "POSTGRES_DB is missing" && exit 1)

          umask 077

          cat > "$GITHUB_WORKSPACE/.env" <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_HOST_PORT=5432
          BACKEND_PORT=8080
          BACKEND_HOST_PORT=8081
          FRONTEND_HOST_PORT=8080
          IMAGE_TAG=latest
          EOF

          echo "Environment file created"
          echo "POSTGRES_DB configured: $POSTGRES_DB"

      # 3. Verify environment file
      - name: Verify environment
        run: |
          test -s "$GITHUB_WORKSPACE/.env"
          test -f "$GITHUB_WORKSPACE/docker-compose.yml"
          echo "Environment file and Compose file found"

      # 4. Verify Docker Hub credentials
      - name: Verify Docker credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Docker username missing" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Docker token missing" && exit 1)
          echo "Docker credentials are configured"

      # 5. Docker Hub Login
      - name: Docker Hub Login
        uses: docker/login-action@v4
        timeout-minutes: 3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Validate Docker Compose
      - name: Validate Docker Compose
        run: |
          docker compose \
            --env-file "$GITHUB_WORKSPACE/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            config --quiet

      # 7. Pull images
      - name: Pull Docker images
        run: |
          docker compose \
            --env-file "$GITHUB_WORKSPACE/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            pull

      # 8. Deploy containers
      - name: Deploy containers
        run: |
          docker compose \
            --env-file "$GITHUB_WORKSPACE/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            up -d

      # 9. Verify deployment
      - name: Check deployment
        run: |
          docker compose \
            --env-file "$GITHUB_WORKSPACE/.env" \
            -f "$GITHUB_WORKSPACE/docker-compose.yml" \
            ps
