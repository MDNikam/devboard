
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [advanced]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # 1. Checkout the exact commit that passed CI
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Create .env file
      - name: Configure environment
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        run: |
          cat > "$GITHUB_WORKSPACE/.env" <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_HOST_PORT=5432
          BACKEND_PORT=8080
          BACKEND_HOST_PORT=8081
          FRONTEND_HOST_PORT=8080
          IMAGE_TAG=latest
          EOF

      # 3. Verify environment variables
      - name: Verify environment
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        run: |
          test -n "$POSTGRES_USER" || (echo "POSTGRES_USER missing" && exit 1)
          test -n "$POSTGRES_PASSWORD" || (echo "POSTGRES_PASSWORD missing" && exit 1)
          test -n "$POSTGRES_DB" || (echo "POSTGRES_DB missing" && exit 1)
          test -f "$GITHUB_WORKSPACE/.env" || (echo ".env file missing" && exit 1)

          echo "Environment configuration successful"

      # 4. Verify Docker Hub credentials
      - name: Verify Docker credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Docker username missing" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Docker token missing" && exit 1)

          echo "Docker credentials are configured"

      # 5. Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v4
        timeout-minutes: 3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Validate Docker Compose
      - name: Validate Docker Compose
        run: |
          docker compose --env-file "$GITHUB_WORKSPACE/.env" config --quiet

      # 7. Pull images from Docker Hub
      - name: Pull Docker images
        run: |
          docker compose --env-file "$GITHUB_WORKSPACE/.env" pull

      # 8. Deploy containers
      - name: Deploy containers
        run: |
          docker compose --env-file "$GITHUB_WORKSPACE/.env" up -d

      # 9. Check deployment
      - name: Check deployment
        run: |
          docker compose --env-file "$GITHUB_WORKSPACE/.env" ps
