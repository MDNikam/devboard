# Goal: To deploy the build images from CI steps once CI Steps successfully completed

name: CD

on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed
        branches: [advanced]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v7
    
        - name: Copy example Env to main env
          run : cp .env.example .env
        
        - name: Dokcer Login
          uses: docker/login-action@v2
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        
        - name: Deploy the containers with docker compose
          run: |
            docker compose pull
            docker compose up -d
            