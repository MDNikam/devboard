
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  backend:
    build: ./backend
    image: mayurnikam7559333233/devboard-backend:${IMAGE_TAG:-latest}
    environment:
      PORT: "${BACKEND_PORT:-8080}"
      POSTGRES_URL: "postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8081}:${BACKEND_PORT:-8080}"

  frontend:
    build: ./frontend
    image: mayurnikam7559333233/devboard-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:4173"

volumes:
  pgdata:
